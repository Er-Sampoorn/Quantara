# Render.com 100% FREE Tier Blueprint (No Credit Card Required)
# Native Python 3.11 Runtime for API & Node.js for Web

services:
  # 1. FastAPI Backend API Service (Free Tier)
  - type: web
    name: quantara-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:///./quantara.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_LIVE_TRADING
        value: "false"

  # 2. Next.js Trading Terminal Frontend Web Service (Free Tier)
  - type: web
    name: quantara-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_URL
        value: https://quantara-8hn1.onrender.com/api/v1
