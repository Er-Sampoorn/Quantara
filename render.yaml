# Render.com Blueprint (Infrastructure as Code)
# Deploy Quantara on Render with one click: https://render.com

services:
  # 1. FastAPI Backend API Service
  - type: web
    name: quantara-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantara-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_LIVE_TRADING
        value: "false"

  # 2. Next.js Trading Terminal Frontend Web Service
  - type: web
    name: quantara-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: quantara-api
          property: host
        value: https://quantara-api.onrender.com/api/v1

# Managed Databases
databases:
  - name: quantara-postgres
    databaseName: quantara_db
    user: quantara
    plan: starter
    region: oregon

# Managed Redis Key-Value Store
redis:
  - name: quantara-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
