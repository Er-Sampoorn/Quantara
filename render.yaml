# Render.com 100% FREE Tier Blueprint (No Credit Card Required)
# Configured with free SQLite database & in-memory event bus

services:
  # 1. FastAPI Backend API Service (Free Tier)
  - type: web
    name: quantara-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./quantara.db
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_LIVE_TRADING
        value: "false"

  # 2. Next.js Trading Terminal Frontend Web Service (Free Tier)
  - type: web
    name: quantara-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_URL
        value: https://quantara-api.onrender.com/api/v1
